<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>החנות שלי - קנייה און-ליין</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }
        
        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .cart-icon {
            position: relative;
            background: rgba(255, 255, 255, 0.2);
            padding: 1rem;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .cart-icon:hover {
            transform: scale(1.1);
        }
        
        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4757;
            color: white;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .product-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
        
        .product-image {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            margin-bottom: 1rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .product-image img:hover {
            transform: scale(1.05);
        }
        
        .product-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }
        
        .product-price {
            font-size: 1.5rem;
            color: #27ae60;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        
        .add-to-cart-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .add-to-cart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }
        
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            transition: right 0.3s ease;
            z-index: 1000;
            box-shadow: -5px 0 20px rgba(0,0,0,0.1);
        }
        
        .cart-sidebar.open {
            right: 0;
        }
        
        .cart-header {
            padding: 2rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .close-cart {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
        }
        
        .cart-items {
            padding: 1rem 2rem;
            max-height: 60%;
            overflow-y: auto;
        }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid #eee;
        }
        
        .cart-total {
            padding: 2rem;
            border-top: 2px solid #eee;
            background: rgba(0,0,0,0.05);
        }
        
        .total-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 1rem;
        }
        
        .checkout-btn {
            width: 100%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .quantity-btn {
            background: #667eea;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .remove-item {
            background: #ff4757;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .checkout-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            z-index: 1001;
            max-width: 400px;
            width: 90%;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .checkout-modal.active {
            opacity: 1;
            visibility: visible;
        }
        
        .success-icon {
            font-size: 4rem;
            color: #4CAF50;
            margin-bottom: 1rem;
        }
        
        .modal-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">🛍️ החנות שלי</div>
        <div class="cart-icon" onclick="toggleCart()">
            🛒
            <span class="cart-count" id="cartCount">0</span>
        </div>
    </header>

    <div class="container">
        <div class="products-grid" id="productsGrid">
            <!-- המוצרים יטענו כאן באמצעות JavaScript -->
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="closeCart()"></div>
    
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>עגלת הקניות שלי</h2>
            <button class="close-cart" onclick="closeCart()">×</button>
        </div>
        <div class="cart-items" id="cartItems">
            <!-- פריטי העגלה יופיעו כאן -->
        </div>
        <div class="cart-total">
            <div class="total-price" id="totalPrice">סה"כ: ₪0</div>
            <button class="checkout-btn" onclick="checkout()">לתשלום</button>
        </div>
    </div>

    <div class="checkout-modal" id="checkoutModal">
        <div class="success-icon">✅</div>
        <h2>תודה על הרכישה!</h2>
        <p>ההזמנה שלך התקבלה בהצלחה</p>
        <p>מספר הזמנה: <span id="orderNumber"></span></p>
        <button class="modal-btn" onclick="closeCheckoutModal()">סגור</button>
    </div>

    <script>
        // מוצרים לדוגמה - אתה יכול לשנות כאן את השמות, המחירים והתמונות
        const products = [
            { id: 1, name: "טלפון חכם", price: 1500, image: "https://via.placeholder.com/200x200/4CAF50/white?text=📱" },
            { id: 2, name: "אוזניות", price: 200, image: "https://via.placeholder.com/200x200/2196F3/white?text=🎧" },
            { id: 3, name: "מחשב נייד", price: 3500, image: "https://via.placeholder.com/200x200/9C27B0/white?text=💻" },
            { id: 4, name: "שעון חכם", price: 800, image: "https://via.placeholder.com/200x200/FF9800/white?text=⌚" },
            { id: 5, name: "מצלמה", price: 2200, image: "https://via.placeholder.com/200x200/F44336/white?text=📷" },
            { id: 6, name: "רמקול", price: 150, image: "https://via.placeholder.com/200x200/607D8B/white?text=🔊" }
        ];

        let cart = [];

        // טעינת המוצרים
        function loadProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-image">${product.emoji}</div>
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">₪${product.price}</div>
                    <button class="add-to-cart-btn" onclick="addToCart(${product.id})">
                        הוסף לעגלה
                    </button>
                </div>
            `).join('');
        }

        // הוספה לעגלה
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCartDisplay();
            updateCartCount();

            // אנימציה קצרה
            const btn = event.target;
            btn.textContent = 'נוסף! ✓';
            btn.style.background = '#4CAF50';
            setTimeout(() => {
                btn.textContent = 'הוסף לעגלה';
                btn.style.background = 'linear-gradient(45deg, #4CAF50, #45a049)';
            }, 1000);
        }

        // עדכון תצוגת העגלה
        function updateCartDisplay() {
            const cartItems = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="text-align: center; color: #666; padding: 2rem;">העגלה שלך ריקה</p>';
                return;
            }

            cartItems.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div>
                        <div style="font-weight: bold;">${item.name}</div>
                        <div style="color: #666;">₪${item.price} × ${item.quantity}</div>
                    </div>
                    <div class="quantity-controls">
                        <button class="quantity-btn" onclick="changeQuantity(${item.id}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button class="quantity-btn" onclick="changeQuantity(${item.id}, 1)">+</button>
                        <button class="remove-item" onclick="removeFromCart(${item.id})">הסר</button>
                    </div>
                </div>
            `).join('');

            updateTotalPrice();
        }

        // שינוי כמות
        function changeQuantity(productId, change) {
            const item = cart.find(item => item.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                } else {
                    updateCartDisplay();
                    updateCartCount();
                }
            }
        }

        // הסרה מהעגלה
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartDisplay();
            updateCartCount();
        }

        // עדכון מחיר כולל
        function updateTotalPrice() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('totalPrice').textContent = `סה"כ: ₪${total}`;
        }

        // עדכון מספר פריטים בעגלה
        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        // פתיחת/סגירת עגלה
        function toggleCart() {
            const sidebar = document.getElementById('cartSidebar');
            const overlay = document.getElementById('overlay');
            
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function closeCart() {
            document.getElementById('cartSidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        }

        // תהליך רכישה
        function checkout() {
            if (cart.length === 0) {
                alert('העגלה שלך ריקה!');
                return;
            }

            const orderNumber = Math.floor(Math.random() * 1000000);
            document.getElementById('orderNumber').textContent = orderNumber;
            document.getElementById('checkoutModal').classList.add('active');
            document.getElementById('overlay').classList.add('active');
            
            // איפוס העגלה
            cart = [];
            updateCartDisplay();
            updateCartCount();
            closeCart();
        }

        function closeCheckoutModal() {
            document.getElementById('checkoutModal').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        // טעינה ראשונית
        loadProducts();
    </script>
</body>
</html>
